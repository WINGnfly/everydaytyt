name: Auto Collect

on:
  schedule:
    - cron: '7 22 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Add random delay (0-10 seconds)
      run: |
        delay_seconds=$((RANDOM % 11))
        echo "Delaying for $delay_seconds seconds to avoid simultaneous runs..."
        sleep $delay_seconds

    - name: Run collect (default)
      env:
        CI_SESSION: ${{ secrets.CI_SESSION }}
        CF_CLEARANCE: ${{ secrets.CF_CLEARANCE }}
        DATA_DIR: noveldata
        BASE_URL: ${{ secrets.BASE_URL }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
        R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_REGION: ${{ secrets.R2_REGION }}
      run: python collect_DPage.py

    - name: Run collect (Chrome version)
      env:
        CI_SESSION: ${{ secrets.HY_CI_SESSION }}
        CF_CLEARANCE: ${{ secrets.HY_CF_CLEARANCE }}
        DATA_DIR: noveldata_HY
        BASE_URL: ${{ secrets.BASE_URL }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
        R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_REGION: ${{ secrets.R2_REGION }}
      run: python collect_DPage.py
